<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="cyber-glow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#1E1B4B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090514"/>
    </radialGradient>
    <linearGradient id="bolt-grad" x1="12%" y1="6%" x2="88%" y2="94%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#FACC15"/>
      <stop offset="70%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="neon-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Cyber Dark Squircle Container -->
  <rect width="512" height="512" rx="140" fill="url(#cyber-glow)" stroke="url(#border-grad)" stroke-width="16"/>

  <!-- Energy Wave Aura -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#6366F1" stroke-width="4" stroke-dasharray="14 14" opacity="0.45"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#A855F7" stroke-width="3" stroke-dasharray="8 8" opacity="0.35"/>

  <!-- Subtle Cyber Currency Glyph -->
  <circle cx="370" cy="140" r="28" fill="#4338CA" opacity="0.8"/>
  <text x="370" y="150" font-size="30" font-weight="900" fill="#E0E7FF" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif">₹</text>

  <!-- Main Crazy Lightning Bolt (Optimized for 16px/32px Crisp Silhouette) -->
  <path
    d="M288 56 L112 280 H240 L208 456 L400 232 L272 232 Z"
    fill="url(#bolt-grad)"
    stroke="#FFFFFF"
    stroke-width="10"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#neon-bloom)"
  />

  <!-- Sparkle Particle Accents -->
  <polygon points="120,130 126,115 141,121 126,127 120,142 114,127 99,121 114,115" fill="#38BDF8"/>
  <polygon points="395,385 400,372 413,377 400,382 395,395 390,382 377,377 390,372" fill="#F43F5E"/>
</svg>